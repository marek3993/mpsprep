[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpsprep"
version = "0.1.0"
description = "Light-cone reduction and line routing that make Qiskit Aer MPS simulation faster, with identical results"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Marek Benda" }]
requires-python = ">=3.10"
dependencies = ["qiskit>=2.0", "qiskit-aer>=0.17", "numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
